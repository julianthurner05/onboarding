<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Service Portal Onboarding – sounddna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: var(--dunkelblau);
      color: var(--text-100);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    .logo { position: absolute; top: 34px; width: 132px; opacity: 0.9; }

    .kicker {
      font-size: var(--fs-base);
      letter-spacing: var(--ls-label);
      color: var(--text-55);
    }

    h1 {
      margin-top: 14px;
      font-size: 52px;
      font-weight: 400;
      letter-spacing: var(--ls-heading);
    }

    @media (max-width: 980px) { h1 { font-size: 38px; } }
  </style>
</head>
<body>
  <img class="logo" src="/assets/logo.svg" alt="sounddna">
  <p class="kicker">Text-to-Store</p>
  <h1>Service Portal Onboarding</h1>
</body>
</html>
