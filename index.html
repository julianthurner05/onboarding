<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text to Store — Test Build</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #e8e8ea;
      --accent: #4ade80;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    main { text-align: center; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { color: #9ca3af; }
    .status {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>text-to-store-tutorial</h1>
    <p>Erster Test-Build — Deployment über Cloudflare Pages funktioniert.</p>
    <span class="status">✓ Build erfolgreich</span>
  </main>
</body>
</html>
